name: ecosphare
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.4
  firebase_storage: ^12.3.8
  firebase_analytics: ^11.6.0
  
  # State Management
  flutter_riverpod: ^2.6.1
  
  # Navigation
  go_router: ^17.0.0
  
  # UI & Theming
  google_fonts: ^6.3.2
  flutter_animate: ^4.5.2
  fl_chart: ^1.1.1
  shimmer: ^3.0.0
  lottie: ^3.2.1
  cached_network_image: ^3.4.1
  timeago: ^3.7.1
  
  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Authentication
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.3
  
  # Media & Files
  image_picker: ^1.1.2
  
  # Location
  geolocator: ^13.0.2
  
  # Testing
  integration_test:
    sdk: flutter
  
  # Utilities
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.5.0
  build_runner: ^2.7.1

flutter:
  uses-material-design: true
  generate: true

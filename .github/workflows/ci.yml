name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.3"
          channel: stable
          cache: true

      # lib/firebase_options.dart is gitignored (generated by
      # `flutterfire configure`). Copy the committed example so analyze/test
      # can compile lib/main.dart without real Firebase credentials.
      - name: Generate firebase_options.dart from example
        run: cp lib/firebase_options.example.dart lib/firebase_options.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run tests
        run: flutter test
